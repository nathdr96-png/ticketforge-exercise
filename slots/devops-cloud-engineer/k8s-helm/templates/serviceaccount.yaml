{{/*
One service account, no role bindings, no mounted token. None of these workloads
calls the Kubernetes API, and a token that is mounted but unused is a credential
sitting in every pod for the benefit of nobody.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "tf.labels" . | nindent 4 }}
    app.kubernetes.io/component: rbac
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
---
{{/*
Disruption budgets, so a node drain cannot take the whole of either public
workload at once. The API's minAvailable is below its replica count on purpose: a
budget equal to the replica count blocks every voluntary eviction forever, which
is how a cluster upgrade ends up stuck behind the thing that was meant to make it
safe.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tf.fullname" . }}-api
  labels:
    {{- include "tf.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-pdb
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "tf.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tf.fullname" . }}-web
  labels:
    {{- include "tf.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-pdb
spec:
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "tf.selectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
