name: deploy
# The deployment pipeline for the TicketForge Helm chart.
#
# This file is part of the deliverable, not documentation of it: it is rendered
# into the artifact set as a `github-workflow` artifact and conformance/infra
# parses it and asserts on it (contract/deploy/policy.yaml DEP-030..032).
#
# It runs on pull_request because validation that runs only after merge tells you
# what you have already shipped.

on:
  pull_request:
    paths:
      - "slots/devops-cloud-engineer/k8s-helm/**"
      - "contract/deploy/**"
      - "conformance/infra/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render and validate the deployment
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below is pinned to a version tag. A branch ref is a third
      # party deciding what runs with our deployment credentials (DEP-031).
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint the chart
        working-directory: slots/devops-cloud-engineer/k8s-helm
        run: make install && make lint

      - name: Render the deployment
        working-directory: slots/devops-cloud-engineer/k8s-helm
        run: make run

      # The gate: the conformance suite runs here and its exit status is the
      # step's. No continue-on-error, no `|| true`, no `if:` that can be flipped
      # to skip it (DEP-030).
      - name: Conformance infra
        run: |
          cd conformance/infra && npm install
          RENDER_DIR="$GITHUB_WORKSPACE/slots/devops-cloud-engineer/k8s-helm/rendered" npx vitest run

      - name: Upload the rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-k8s-helm
          path: slots/devops-cloud-engineer/k8s-helm/rendered/
          if-no-files-found: error

  deploy-staging:
    name: Apply to staging
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      # No credentials in this file and none in the chart. The cluster
      # credential is an environment secret on the `staging` environment, which
      # is also where the required reviewer lives.
      - name: helm upgrade --install
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          helm upgrade --install ticketforge slots/devops-cloud-engineer/k8s-helm \
            --namespace ticketforge --create-namespace \
            --atomic --timeout 10m \
            --values slots/devops-cloud-engineer/k8s-helm/values.yaml \
            --values slots/devops-cloud-engineer/k8s-helm/values.staging.yaml
